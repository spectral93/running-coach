[project]
name = "running-coach"
version = "0.1.0"
description = "An open-source, bring-your-own-LLM running coach agent for 5K to marathon."
readme = "README.md"
authors = [
    { name = "spectral93" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.58.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
coach = "running_coach.interfaces.cli:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
